<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        button#add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            gap: 10px;
        }
        .todo-text {
            flex: 1;
            cursor: pointer;
        }
        .todo-text.completed {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.875rem;
            padding: 4px 8px;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autofocus>
            <button id="add-btn">Add</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="footer">
            <span id="remaining-count">0</span> items left
        </div>
    </div>

    <script type="module">
        import { addTodo, toggleTodo, deleteTodo, getRemainingCount } from './logic.js';

        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const list = document.getElementById('todo-list');
        const countDisplay = document.getElementById('remaining-count');

        function render() {
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.onclick = () => {
                    todos = toggleTodo(todos, todo.id);
                    saveAndRender();
                };

                const span = document.createElement('span');
                span.className = `todo-text ${todo.completed ? 'completed' : ''}`;
                span.textContent = todo.text;
                span.onclick = () => {
                    todos = toggleTodo(todos, todo.id);
                    saveAndRender();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = 'Delete';
                delBtn.onclick = () => {
                    todos = deleteTodo(todos, todo.id);
                    saveAndRender();
                };

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(delBtn);
                list.appendChild(li);
            });

            countDisplay.textContent = getRemainingCount(todos);
        }

        function saveAndRender() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        addBtn.onclick = () => {
            const text = input.value;
            if (text.trim()) {
                todos = addTodo(todos, text);
                input.value = '';
                saveAndRender();
            }
        };

        input.onkeypress = (e) => {
            if (e.key === 'Enter') addBtn.onclick();
        };

        render();
    </script>
</body>
</html>
